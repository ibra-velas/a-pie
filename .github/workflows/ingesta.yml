name: Ingesta semanal OSM

on:
  schedule:
    - cron: '0 3 * * 1'   # lunes 03:00 UTC
  workflow_dispatch:

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ingesta/requirements.txt

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingesta/run_ingesta.py
