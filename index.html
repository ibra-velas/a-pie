<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>A Pie — Vive tu barrio</title>
    <meta name="description" content="Descubre todo lo que tienes a 15 minutos caminando desde cualquier dirección en Tenerife. Farmacias, comercios, parques, restaurantes — tu barrio caminable." />
    <meta name="theme-color" content="#1C7A8A" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A Pie — Vive tu barrio" />
    <meta property="og:description" content="¿Qué tienes a 15 minutos caminando desde casa? Descubre tu barrio en Tenerife." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Pie — Vive tu barrio" />
    <meta name="twitter:description" content="¿Qué tienes a 15 minutos caminando desde casa? Descubre tu barrio en Tenerife." />
    <meta name="twitter:image" content="/images/twitter-og-image.jpg" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
      /* Global font: portaled content (bottom sheet) renders outside the
         app shell div, so the font must live on body, not on the shell */
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: #2B2820;
      }
      /* Full-screen map app: dragging the sheet down must never trigger the
         browser's pull-to-refresh (it reloaded the page mid-use) */
      html, body {
        overscroll-behavior-y: none;
      }
      /* Brand color for native controls (range slider thumb/track) */
      input[type="range"] {
        accent-color: #1C7A8A;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Visible focus for keyboard navigation only (not mouse clicks) */
      :focus-visible {
        outline: 2px solid #1C7A8A;
        outline-offset: 2px;
      }
      @keyframes march {
        to { stroke-dashoffset: -16; }
      }
      .marching-line {
        animation: march 0.6s linear infinite;
      }
      @keyframes origin-pulse {
        0%   { transform: scale(0.4); opacity: 0.7; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .origin-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #1C7A8A;
        animation: origin-pulse 1.8s ease-out infinite;
      }
      .origin-dot {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: #1C7A8A;
        border: 2.5px solid white;
        box-shadow: 0 1px 6px rgba(0,0,0,0.35);
      }
      /* Splash: shown while the JS bundle loads; App.jsx fades it out on mount */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 20000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAF7F2;
        transition: opacity 0.8s ease;
      }
      #splash img {
        width: min(68vw, 300px);
        height: auto;
        animation: splash-in 1s ease both;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/images/a-pie-logo.webp" alt="" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
